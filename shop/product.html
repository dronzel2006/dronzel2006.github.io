<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Товар — Листья</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"><div class="wrap bar">
  <a class="logo" href="index.html">Листья</a>
  <nav>
    <a class="on" href="index.html">Магазин</a>
    <a href="delivery.html">Доставка</a>
    <a class="cart" href="cart.html">Корзина <b data-cart-count>0</b></a>
  </nav>
</div></header>
<div class="wrap product" id="root"></div>
<footer class="site"><div class="wrap"><span>Демо-проект</span><span>Андрей Добридник</span></div></footer>
<script src="data.js"></script>
<script>
const p = PRODUCTS.find(x=>x.id===new URLSearchParams(location.search).get("id")) || PRODUCTS[0];
document.title = p.name + " — Листья";
document.getElementById("root").innerHTML = `
  <div class="gallery"><img src="${p.img}" alt="${p.name}"></div>
  <div>
    <div class="kicker">${CATS[p.cat]}</div>
    <h1>${p.name}</h1>
    <p class="meta">${p.meta}</p>
    <p style="margin:16px 0">${p.desc}</p>
    <div class="price" style="font-size:28px;margin:12px 0 18px">${rub(p.price)}</div>
    <button class="btn" onclick="add('${p.id}')">Положить в корзину</button>
    <p class="meta" style="margin-top:16px">Доставка 1–3 дня · самовывоз в день заказа</p>
  </div>`;
</script>
</body>
</html>

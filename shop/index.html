<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Листья — магазин чая и посуды | Демо-проект</title>
<meta name="description" content="Интернет-магазин чая: каталог, фильтры, корзина и оформление заказа.">
<style>
  :root { --green:#2e6b3f; --green-l:#e7f2ea; --ink:#1d2a21; --muted:#6a7a6e; --bg:#fbfaf6; --line:#e6e9e2; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:"Segoe UI", Roboto, Arial, sans-serif; color:var(--ink); background:var(--bg); }
  button { font-family:inherit; cursor:pointer; }
  .wrap { max-width:1180px; margin:0 auto; padding:0 20px; }
  header { background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  .bar { display:flex; align-items:center; gap:20px; height:70px; }
  .logo { font-weight:800; font-size:22px; color:var(--green); white-space:nowrap; }
  .search { flex:1; position:relative; }
  .search input { width:100%; padding:12px 16px 12px 42px; border:1px solid var(--line); border-radius:30px; font-size:15px; background:var(--bg); }
  .search::before { content:"🔍"; position:absolute; left:15px; top:50%; transform:translateY(-50%); font-size:14px; }
  .cart-btn { position:relative; background:var(--green); color:#fff; border:0; padding:11px 20px; border-radius:30px; font-weight:600; font-size:15px; }
  .cart-btn b { position:absolute; top:-6px; right:-6px; background:#e8553e; border-radius:50%; width:22px; height:22px; font-size:12px; display:grid; place-items:center; }
  .promo { background:linear-gradient(120deg,var(--green),#4f9a62); color:#fff; border-radius:24px; padding:40px; margin:28px 0; display:flex; justify-content:space-between; align-items:center; gap:20px; }
  .promo h1 { font-size:34px; margin-bottom:8px; }
  .promo p { opacity:.9; }
  .promo .leaf { font-size:90px; }
  .tools { display:flex; justify-content:space-between; align-items:center; gap:14px; margin-bottom:20px; flex-wrap:wrap; }
  .cats { display:flex; gap:8px; flex-wrap:wrap; }
  .cats button { border:1px solid var(--line); background:#fff; padding:9px 16px; border-radius:20px; font-weight:600; color:var(--muted); }
  .cats button.on { background:var(--green); color:#fff; border-color:var(--green); }
  select { padding:9px 14px; border-radius:20px; border:1px solid var(--line); background:#fff; font-size:14px; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:20px; margin-bottom:60px; }
  .item { background:#fff; border:1px solid var(--line); border-radius:18px; overflow:hidden; display:flex; flex-direction:column; transition:.2s; }
  .item:hover { box-shadow:0 14px 30px rgba(29,42,33,.08); transform:translateY(-2px); }
  .item .pic { height:160px; display:grid; place-items:center; font-size:64px; position:relative; }
  .item .new { position:absolute; top:12px; left:12px; background:#e8553e; color:#fff; font-size:12px; font-weight:700; padding:3px 9px; border-radius:10px; }
  .item .body { padding:16px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .item h3 { font-size:16px; }
  .item .meta { font-size:13px; color:var(--muted); }
  .item .row { margin-top:auto; display:flex; justify-content:space-between; align-items:center; padding-top:10px; }
  .item .price { font-weight:800; font-size:18px; }
  .add { border:0; background:var(--green-l); color:var(--green); font-weight:700; padding:9px 14px; border-radius:12px; }
  .add.in { background:var(--green); color:#fff; }
  .empty { grid-column:1/-1; text-align:center; color:var(--muted); padding:60px 0; }
  .shade { position:fixed; inset:0; background:rgba(0,0,0,.35); opacity:0; pointer-events:none; transition:.25s; z-index:20; }
  .drawer { position:fixed; top:0; right:0; width:420px; max-width:100%; height:100%; background:#fff; transform:translateX(100%); transition:.3s; z-index:21; display:flex; flex-direction:column; }
  .open .shade { opacity:1; pointer-events:auto; } .open .drawer { transform:none; }
  .drawer header { position:static; display:flex; justify-content:space-between; align-items:center; padding:20px; }
  .drawer h2 { font-size:22px; }
  .x { border:0; background:none; font-size:26px; color:var(--muted); }
  .lines { flex:1; overflow:auto; padding:0 20px; }
  .line { display:flex; gap:12px; align-items:center; padding:14px 0; border-bottom:1px solid var(--line); }
  .line .ico { font-size:34px; width:52px; height:52px; display:grid; place-items:center; border-radius:12px; background:var(--green-l); }
  .line .info { flex:1; font-size:14px; } .line .info b { display:block; font-size:15px; }
  .qty { display:flex; align-items:center; gap:8px; }
  .qty button { width:28px; height:28px; border-radius:8px; border:1px solid var(--line); background:#fff; font-weight:700; }
  .foot { padding:20px; border-top:1px solid var(--line); }
  .sumrow { display:flex; justify-content:space-between; margin-bottom:8px; color:var(--muted); }
  .sumrow.total { color:var(--ink); font-weight:800; font-size:20px; margin:12px 0 16px; }
  .go { width:100%; border:0; background:var(--green); color:#fff; padding:15px; border-radius:14px; font-size:16px; font-weight:700; }
  .go:disabled { opacity:.4; cursor:default; }
  .checkout input, .checkout select, .checkout textarea { width:100%; padding:12px; border:1px solid var(--line); border-radius:10px; margin-bottom:10px; font-size:15px; font-family:inherit; }
  .checkout .radio { display:flex; gap:8px; margin-bottom:10px; }
  .checkout .radio label { flex:1; border:1px solid var(--line); border-radius:10px; padding:10px; font-size:14px; cursor:pointer; }
  .checkout .radio input { width:auto; margin:0 6px 0 0; }
  .thanks { text-align:center; padding:50px 20px; } .thanks div { font-size:60px; }
  footer { border-top:1px solid var(--line); padding:26px 0; color:var(--muted); font-size:14px; background:#fff; }
  footer .wrap { display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; }
  @media (max-width:1000px) { .grid { grid-template-columns:repeat(2,1fr); } }
  @media (max-width:560px) { .grid { grid-template-columns:1fr 1fr; gap:12px; } .item .pic { height:120px; font-size:48px; } .promo .leaf { display:none; } .logo { font-size:18px; } .bar { gap:10px; } .promo h1 { font-size:26px; } }
</style>
</head>
<body>
<header><div class="wrap bar">
  <div class="logo">🍃 Листья</div>
  <div class="search"><input id="q" placeholder="Найти чай, посуду, подарок..."></div>
  <button class="cart-btn" id="openCart">Корзина <b id="count">0</b></button>
</div></header>

<main class="wrap">
  <div class="promo"><div><h1>Свежий урожай улуна</h1><p>Доставка от 1 500 ₽ бесплатно. При заказе от 3 000 ₽ — пробник в подарок.</p></div><div class="leaf">🍃</div></div>
  <div class="tools">
    <div class="cats" id="cats"><button class="on" data-c="all">Все</button><button data-c="green">Зелёный</button><button data-c="black">Чёрный</button><button data-c="oolong">Улун</button><button data-c="herb">Травяной</button><button data-c="ware">Посуда</button></div>
    <select id="sort"><option value="pop">Сначала популярные</option><option value="cheap">Сначала дешёвые</option><option value="exp">Сначала дорогие</option></select>
  </div>
  <div class="grid" id="grid"></div>
</main>

<footer><div class="wrap"><span>© Листья — демо-проект интернет-магазина для портфолио</span><span>Разработка: Андрей Добридник</span></div></footer>

<div id="cartRoot">
  <div class="shade" id="shade"></div>
  <aside class="drawer">
    <header><h2 id="dTitle">Корзина</h2><button class="x" id="close">×</button></header>
    <div class="lines" id="lines"></div>
    <div class="foot" id="foot"></div>
  </aside>
</div>

<script>
const products = [
  {id:1, name:'Те Гуань Инь', cat:'oolong', meta:'Улун, Фуцзянь · 100 г', price:890, pop:9, ico:'🍵', bg:'#e7f2ea', isNew:true},
  {id:2, name:'Сенча Premium', cat:'green', meta:'Зелёный, Япония · 80 г', price:760, pop:8, ico:'🍃', bg:'#eef6e3'},
  {id:3, name:'Дянь Хун', cat:'black', meta:'Красный, Юньнань · 100 г', price:640, pop:10, ico:'🌰', bg:'#f6e8de'},
  {id:4, name:'Мятный сбор', cat:'herb', meta:'Мята, мелисса, чабрец · 60 г', price:390, pop:6, ico:'🌿', bg:'#e6f3ee'},
  {id:5, name:'Да Хун Пао', cat:'oolong', meta:'Утёсный улун · 100 г', price:1290, pop:7, ico:'🍂', bg:'#f3e9dc'},
  {id:6, name:'Ассам TGFOP', cat:'black', meta:'Чёрный, Индия · 100 г', price:520, pop:5, ico:'☕', bg:'#f2e4dc'},
  {id:7, name:'Гайвань 150 мл', cat:'ware', meta:'Фарфор, ручная роспись', price:1490, pop:6, ico:'🏺', bg:'#e9eef6', isNew:true},
  {id:8, name:'Матча церемониальная', cat:'green', meta:'Порошковый, Удзи · 30 г', price:1190, pop:9, ico:'🍶', bg:'#e3f1dc'},
  {id:9, name:'Иван-чай с липой', cat:'herb', meta:'Ферментированный · 80 г', price:340, pop:7, ico:'🌸', bg:'#f6e9ef'},
  {id:10, name:'Набор пиал (4 шт.)', cat:'ware', meta:'Глина, обжиг', price:1990, pop:4, ico:'🍶', bg:'#eceae6'},
  {id:11, name:'Лунцзин', cat:'green', meta:'Колодец дракона · 50 г', price:980, pop:8, ico:'🐉', bg:'#eaf4e1'},
  {id:12, name:'Молочный улун', cat:'oolong', meta:'Тайвань · 100 г', price:720, pop:10, ico:'🥛', bg:'#f1f3e6'},
];
const $ = s => document.querySelector(s);
const rub = n => n.toLocaleString('ru-RU') + ' ₽';
let cat = 'all', cart = JSON.parse(localStorage.getItem('leaf-cart') || '{}'), step = 'cart';
const save = () => localStorage.setItem('leaf-cart', JSON.stringify(cart));

function renderGrid() {
  const q = $('#q').value.trim().toLowerCase();
  let list = products.filter(p => (cat === 'all' || p.cat === cat) && (p.name + p.meta).toLowerCase().includes(q));
  const s = $('#sort').value;
  list.sort((a, b) => s === 'cheap' ? a.price - b.price : s === 'exp' ? b.price - a.price : b.pop - a.pop);
  $('#grid').innerHTML = list.length ? list.map(p => `
    <div class="item"><div class="pic" style="background:${p.bg}">${p.ico}${p.isNew ? '<span class="new">Новинка</span>' : ''}</div>
      <div class="body"><h3>${p.name}</h3><div class="meta">${p.meta}</div>
        <div class="row"><span class="price">${rub(p.price)}</span>
          <button class="add ${cart[p.id] ? 'in' : ''}" data-id="${p.id}">${cart[p.id] ? '✓ ' + cart[p.id] + ' шт.' : 'В корзину'}</button></div></div></div>`).join('')
    : '<div class="empty">Ничего не нашлось. Попробуйте другой запрос 🍵</div>';
}

function totals() {
  const sum = Object.entries(cart).reduce((s, [id, q]) => s + products.find(p => p.id == id).price * q, 0);
  const delivery = sum >= 1500 || sum === 0 ? 0 : 290;
  return {sum, delivery, total: sum + delivery};
}

function renderCart() {
  const n = Object.values(cart).reduce((a, b) => a + b, 0);
  $('#count').textContent = n;
  if (step === 'done') return;
  const t = totals();
  if (step === 'cart') {
    $('#dTitle').textContent = 'Корзина';
    const ids = Object.keys(cart);
    $('#lines').innerHTML = ids.length ? ids.map(id => { const p = products.find(x => x.id == id); return `
      <div class="line"><div class="ico">${p.ico}</div><div class="info"><b>${p.name}</b>${rub(p.price)}</div>
      <div class="qty"><button data-d="-1" data-id="${id}">−</button>${cart[id]}<button data-d="1" data-id="${id}">+</button></div></div>`; }).join('')
      : '<p style="color:var(--muted);padding:30px 0;text-align:center">Корзина пока пустая</p>';
    $('#foot').innerHTML = `
      <div class="sumrow"><span>Товары</span><span>${rub(t.sum)}</span></div>
      <div class="sumrow"><span>Доставка</span><span>${t.delivery ? rub(t.delivery) : 'бесплатно'}</span></div>
      ${t.sum && t.sum < 1500 ? `<div class="sumrow" style="color:var(--green)"><span>До бесплатной доставки</span><span>${rub(1500 - t.sum)}</span></div>` : ''}
      <div class="sumrow total"><span>Итого</span><span>${rub(t.total)}</span></div>
      <button class="go" id="toCheckout" ${t.sum ? '' : 'disabled'}>Оформить заказ</button>`;
  } else {
    $('#dTitle').textContent = 'Оформление';
    $('#lines').innerHTML = `<form class="checkout" id="checkout" style="padding-top:6px">
      <input required placeholder="Имя"><input required type="tel" placeholder="Телефон"><input type="email" placeholder="E-mail для чека">
      <div class="radio"><label><input type="radio" name="d" checked>Курьер</label><label><input type="radio" name="d">Пункт выдачи</label></div>
      <input required placeholder="Адрес доставки"><textarea rows="2" placeholder="Комментарий к заказу"></textarea></form>`;
    $('#foot').innerHTML = `<div class="sumrow total"><span>К оплате</span><span>${rub(t.total)}</span></div>
      <button class="go" id="pay">Подтвердить заказ</button><button class="go" id="back" style="background:none;color:var(--muted);margin-top:6px">← Назад в корзину</button>`;
  }
}

function change(id, d) { cart[id] = (cart[id] || 0) + d; if (cart[id] <= 0) delete cart[id]; save(); renderGrid(); renderCart(); }

$('#grid').addEventListener('click', e => { const b = e.target.closest('.add'); if (b) change(b.dataset.id, 1); });
$('#lines').addEventListener('click', e => { const b = e.target.closest('[data-d]'); if (b) change(b.dataset.id, +b.dataset.d); });
$('#foot').addEventListener('click', e => {
  if (e.target.id === 'toCheckout') { step = 'checkout'; renderCart(); }
  if (e.target.id === 'back') { step = 'cart'; renderCart(); }
  if (e.target.id === 'pay') {
    const f = $('#checkout'); if (!f.reportValidity()) return;
    const num = 'L-' + Math.floor(10000 + Math.random() * 89999);
    cart = {}; save(); step = 'done'; renderGrid(); renderCart();
    $('#dTitle').textContent = 'Готово';
    $('#lines').innerHTML = `<div class="thanks"><div>🎉</div><h3>Заказ ${num} оформлен</h3><p style="color:var(--muted);margin-top:8px">Мы отправили подтверждение и скоро свяжемся с вами.</p></div>`;
    $('#foot').innerHTML = '<button class="go" id="again">Продолжить покупки</button>';
  }
  if (e.target.id === 'again') { step = 'cart'; document.body.classList.remove('open'); renderCart(); }
});
$('#cats').addEventListener('click', e => { if (e.target.tagName !== 'BUTTON') return; cat = e.target.dataset.c; document.querySelectorAll('#cats button').forEach(b => b.classList.toggle('on', b === e.target)); renderGrid(); });
$('#q').addEventListener('input', renderGrid);
$('#sort').addEventListener('change', renderGrid);
$('#openCart').onclick = () => { if (step === 'done') step = 'cart'; renderCart(); document.body.classList.add('open'); };
$('#close').onclick = $('#shade').onclick = () => document.body.classList.remove('open');
renderGrid(); renderCart();
</script>
</body>
</html>

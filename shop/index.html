<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Листья — чай и посуда</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"><div class="wrap bar">
  <a class="logo" href="index.html">Листья</a>
  <nav>
    <a class="on" href="index.html">Магазин</a>
    <a href="delivery.html">Доставка</a>
    <a class="cart" href="cart.html">Корзина <b data-cart-count>0</b></a>
  </nav>
</div></header>
<main class="wrap">
  <div class="hero">
    <img src="img/tea_hero.jpg" alt="Чайная церемония">
    <div class="hero-in">
      <div class="kicker">Чайная лавка</div>
      <h1>Листья текущего сезона</h1>
      <p class="meta" style="margin-bottom:18px">Отбор с гор, помол матчи, посуда. Доставка от 1 500 ₽ бесплатно.</p>
      <a class="btn" href="#grid">Открыть каталог</a>
    </div>
  </div>
  <img src="img/tea_leaves.jpg" alt="Сорта чая" style="width:100%;border-radius:24px;max-height:280px;object-fit:cover;margin-bottom:28px">
  <div class="tools" id="tools"></div>
  <div class="grid" id="grid"></div>
</main>
<footer class="site"><div class="wrap"><span>Листья — демо-проект интернет-магазина</span><span>Андрей Добридник</span></div></footer>
<script src="data.js"></script>
<script>
let cat="all";
const tools=document.getElementById("tools");
tools.innerHTML=Object.entries(CATS).map(([k,v])=>`<button class="${k==="all"?"on":""}" data-c="${k}">${v}</button>`).join("");
tools.onclick=e=>{const b=e.target.closest("button"); if(!b)return; cat=b.dataset.c; [...tools.children].forEach(x=>x.classList.toggle("on",x===b)); draw();};
function draw(){ document.getElementById("grid").innerHTML=PRODUCTS.filter(p=>cat==="all"||p.cat===cat).map(cardHTML).join(""); }
draw();
</script>
</body>
</html>

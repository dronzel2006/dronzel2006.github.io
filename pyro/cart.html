<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Корзина — НЕБО</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"><div class="wrap bar">
  <a class="logo" href="index.html">НЕ<span>БО</span></a>
  <nav>
    <a href="index.html">Главная</a>
    <a href="catalog.html">Каталог</a>
    <a href="delivery.html">Доставка</a>
    <a class="cart-link on" href="cart.html">Корзина <b data-cart-count>0</b></a>
  </nav>
</div></header>
<div class="wrap">
  <div class="page-head"><div class="kicker">Оформление</div><h1 style="font-size:48px">Корзина</h1></div>
  <div class="cart-page">
    <div id="lines"></div>
    <div class="box" id="sum"></div>
  </div>
</div>
<footer class="site"><div class="wrap"><span>НЕБО · демо</span><span>18+</span></div></footer>
<script src="data.js"></script>
<script>
function totals() {
  const sum = Object.entries(cart).reduce((s,[id,q]) => s + PRODUCTS.find(p=>p.id===id).price * q, 0);
  const delivery = sum>=8000 || sum===0 ? 0 : 290;
  return {sum, delivery, total: sum+delivery};
}
function draw() {
  const ids = Object.keys(cart);
  document.getElementById("lines").innerHTML = ids.length ? ids.map(id => {
    const p = PRODUCTS.find(x=>x.id===id);
    return `<div class="line"><img src="${p.img}" alt="">
      <div><b>${p.name}</b><div class="meta">${p.short}</div></div>
      <div class="qty"><button onclick="add('${id}',-1)">−</button>${cart[id]}<button onclick="add('${id}',1);draw()">+</button></div>
      <div class="price">${rub(p.price*cart[id])}</div></div>`;
  }).join("") : '<p class="empty">Корзина пустая. <a href="catalog.html">В каталог</a></p>';
  const t = totals();
  document.getElementById("sum").innerHTML = `
    <h3>Итого</h3>
    <p class="row"><span>Товары</span><b>${rub(t.sum)}</b></p>
    <p class="row"><span>Доставка</span><b>${t.delivery?rub(t.delivery):"бесплатно"}</b></p>
    <p class="row" style="font-size:22px;margin:12px 0 18px"><span>К оплате</span><span class="price">${rub(t.total)}</span></p>
    <p class="notice">Получатель 18+, паспорт на руках.</p>
    <button class="btn btn-gold" style="width:100%" ${t.sum?"":"disabled"} onclick="pay()">Оформить</button>`;
  badge();
}
function pay() {
  if (!Object.keys(cart).length) return;
  Object.keys(cart).forEach(k => delete cart[k]); save();
  document.getElementById("lines").innerHTML = '<p class="empty">Заказ принят. В этом демо он никуда не уходит — спасибо, что прошли сценарий.</p>';
  draw();
}
const _add = add;
add = (id,n=1) => { _add(id,n); draw(); };
draw();
</script>
</body>
</html>

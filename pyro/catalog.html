<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Каталог — НЕБО</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"><div class="wrap bar">
  <a class="logo" href="index.html">НЕ<span>БО</span></a>
  <nav>
    <a href="index.html">Главная</a>
    <a class="on" href="catalog.html">Каталог</a>
    <a href="delivery.html">Доставка</a>
    <a class="cart-link" href="cart.html">Корзина <b data-cart-count>0</b></a>
  </nav>
</div></header>
<div class="wrap">
  <div class="page-head">
    <div class="kicker">10 позиций</div>
    <h1 style="font-size:48px">Каталог</h1>
    <p class="sub">Фильтр по типу, карточка открывается отдельно.</p>
  </div>
  <div class="tools" id="tools"></div>
  <div class="grid" id="grid"></div>
</div>
<footer class="site"><div class="wrap"><span>НЕБО · демо-проект</span><span>18+</span></div></footer>
<script src="data.js"></script>
<script>
const params = new URLSearchParams(location.search);
let cat = params.get("cat") || "all";
const tools = document.getElementById("tools");
tools.innerHTML = Object.entries(CATS).map(([k,v]) =>
  `<button class="${k===cat?'on':''}" data-c="${k}">${v}</button>`).join("");
tools.onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  cat = b.dataset.c;
  [...tools.children].forEach(x => x.classList.toggle("on", x===b));
  render();
};
function render() {
  const list = PRODUCTS.filter(p => cat==="all" || p.cat===cat);
  document.getElementById("grid").innerHTML = list.map(p => `
    <article class="card">
      <a class="pic" href="product.html?id=${p.id}"><img src="${p.img}" alt="${p.name}"></a>
      <div class="body">
        <h3><a href="product.html?id=${p.id}" style="text-decoration:none">${p.name}</a></h3>
        <div class="meta">${p.short} · класс ${p.level}</div>
        <div class="row"><span class="price">${rub(p.price)}</span>
          <button class="btn btn-gold" style="padding:8px 14px" onclick="add('${p.id}')">В корзину</button></div>
      </div>
    </article>`).join("") || '<p class="empty">В этой категории пока пусто</p>';
}
render();
</script>
</body>
</html>

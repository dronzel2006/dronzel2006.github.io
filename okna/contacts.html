<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Замер — Окна Света</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{font-family:Manrope,sans-serif;margin:0;color:#122033;background:#f4f7fb}
.wrap{width:min(720px,calc(100% - 32px));margin:0 auto}
header{background:#fff;border-bottom:1px solid #e3eaf3}
.bar{width:min(1120px,calc(100% - 32px));margin:0 auto;display:flex;align-items:center;height:68px;gap:20px}
.logo{font-weight:800;color:#1a5fd0;text-decoration:none;font-size:20px}
nav{margin-left:auto;display:flex;gap:16px;font-weight:650;font-size:14px}
nav a{color:inherit;text-decoration:none} nav a.on{color:#1a5fd0}
form{background:#fff;padding:24px;border-radius:20px;margin:28px 0 60px;display:grid;gap:10px}
input,textarea{padding:12px;border:1px solid #d5deea;border-radius:10px;font:15px Manrope}
button{background:#1a5fd0;color:#fff;border:0;padding:12px;border-radius:12px;font:700 15px Manrope;cursor:pointer}
.muted{color:#5c6b80}
</style>
</head>
<body>
<header><div class="bar">
  <a class="logo" href="index.html">Окна Света</a>
  <nav><a href="index.html">Расчёт</a><a href="catalog.html">Профили</a><a class="on" href="contacts.html">Замер</a></nav>
</div></header>
<main class="wrap">
  <p style="color:#1a5fd0;font-weight:800;font-size:12px;letter-spacing:.14em;margin:28px 0 8px">ЗАЯВКА</p>
  <h1>Вызов замерщика</h1>
  <p class="muted">Замер бесплатный, смета в тот же день. Форма демо — заявка никуда не уходит.</p>
  <form onsubmit="event.preventDefault(); ok.hidden=false; this.hidden=true;">
    <input required placeholder="Имя">
    <input required placeholder="Телефон" type="tel">
    <input required placeholder="Адрес объекта">
    <textarea rows="3" placeholder="Сколько окон, этаж, срочность"></textarea>
    <button>Оставить заявку</button>
  </form>
  <p id="ok" hidden>Заявка принята. В этом демо дальше ничего не отправляется.</p>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Прайс — Гараж 52</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
body{font-family:Inter,sans-serif;margin:0;background:#0d0f12;color:#eef0f4}
.wrap{width:min(900px,calc(100% - 32px));margin:0 auto}
.bar{width:min(1120px,calc(100% - 32px));margin:0 auto;display:flex;align-items:center;height:70px}
.logo{font-family:Oswald,sans-serif;font-size:26px;text-decoration:none;color:inherit;letter-spacing:.06em}
.logo span{color:#ffc21a}
nav{margin-left:auto;display:flex;gap:16px;font-weight:650;font-size:14px}
nav a{color:inherit;text-decoration:none} nav a.on{color:#ffc21a}
table{width:100%;border-collapse:collapse;margin:24px 0 60px}
td,th{padding:14px 8px;border-bottom:1px solid #262b34;text-align:left}
th{color:#9aa3b2;font-size:12px;letter-spacing:.08em}
h1{font-family:Oswald,sans-serif;font-size:42px;margin-top:28px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tabs button{background:#16191f;color:#eef0f4;border:1px solid #262b34;padding:8px 14px;border-radius:999px;cursor:pointer}
.tabs button.on{background:#ffc21a;color:#111;border-color:#ffc21a;font-weight:700}
</style>
</head>
<body>
<header style="border-bottom:1px solid #262b34"><div class="bar">
  <a class="logo" href="index.html">ГАРАЖ <span>52</span></a>
  <nav><a href="index.html">Сервис</a><a class="on" href="prices.html">Прайс</a><a href="book.html">Запись</a></nav>
</div></header>
<main class="wrap">
  <h1>Прайс</h1>
  <div class="tabs" id="tabs">
    <button class="on" data-t="to">ТО</button>
    <button data-t="brake">Тормоза</button>
    <button data-t="hod">Ходовая</button>
  </div>
  <table><thead><tr><th>Работа</th><th>Срок</th><th>Цена</th></tr></thead><tbody id="tb"></tbody></table>
</main>
<script>
const DATA={
 to:[["Замена масла и фильтра","40 мин","2 900 ₽"],["Компьютерная диагностика","45 мин","1 900 ₽"],["ТО-1 (осмотр + жидкости)","2 ч","6 500 ₽"]],
 brake:[["Колодки, ось","1 ч","3 400 ₽"],["Диски, ось","2 ч","7 800 ₽"],["Прокачка контура","40 мин","1 600 ₽"]],
 hod:[["Развал-схождение","1 ч","4 200 ₽"],["Рычаг / сайлентблок","1.5 ч","от 3 900 ₽"],["Стойка амортизатора","1.5 ч","от 4 500 ₽"]]
};
const tb=document.getElementById("tb");
function draw(t){ tb.innerHTML=DATA[t].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join(""); }
draw("to");
document.getElementById("tabs").onclick=e=>{
  const b=e.target.closest("button"); if(!b) return;
  [...e.currentTarget.children].forEach(x=>x.classList.toggle("on",x===b));
  draw(b.dataset.t);
};
</script>
</body>
</html>

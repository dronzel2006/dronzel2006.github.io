<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Запись — Гараж 52</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
body{font-family:Inter,sans-serif;margin:0;background:#0d0f12;color:#eef0f4}
.wrap{width:min(640px,calc(100% - 32px));margin:0 auto}
.bar{width:min(1120px,calc(100% - 32px));margin:0 auto;display:flex;align-items:center;height:70px}
.logo{font-family:Oswald,sans-serif;font-size:26px;text-decoration:none;color:inherit}
.logo span{color:#ffc21a}
nav{margin-left:auto;display:flex;gap:16px;font-weight:650;font-size:14px}
nav a{color:inherit;text-decoration:none} nav a.on{color:#ffc21a}
.slots{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.slots button{background:#16191f;border:1px solid #262b34;color:#eef0f4;padding:8px 12px;border-radius:10px;cursor:pointer}
.slots button.on{background:#ffc21a;color:#111;font-weight:700}
form{display:grid;gap:10px;margin:18px 0 60px}
input,select{padding:12px;border-radius:10px;border:1px solid #262b34;background:#16191f;color:#fff;font:15px Inter}
button.go{background:#ffc21a;border:0;padding:12px;border-radius:10px;font-weight:800;cursor:pointer}
h1{font-family:Oswald,sans-serif;font-size:42px;margin-top:28px}
img{width:100%;height:200px;object-fit:cover;border-radius:16px;margin-top:12px}
</style>
</head>
<body>
<header style="border-bottom:1px solid #262b34"><div class="bar">
  <a class="logo" href="index.html">ГАРАЖ <span>52</span></a>
  <nav><a href="index.html">Сервис</a><a href="prices.html">Прайс</a><a class="on" href="book.html">Запись</a></nav>
</div></header>
<main class="wrap">
  <h1>Онлайн-запись</h1>
  <img src="img/auto_service.jpg" alt="Работа в боксе">
  <p style="color:#9aa3b2;margin:12px 0">Свободные окна на завтра. Демо: запись никуда не уходит.</p>
  <div class="slots" id="slots"></div>
  <form onsubmit="event.preventDefault(); this.hidden=true; ok.hidden=false;">
    <input required placeholder="Имя">
    <input required placeholder="Телефон" type="tel">
    <input required placeholder="Марка и гос. номер">
    <select><option>Диагностика</option><option>Масло</option><option>Тормоза</option><option>Ходовая</option></select>
    <button class="go">Подтвердить окно</button>
  </form>
  <p id="ok" hidden>Окно забронировано. В боевом сайте уходит мастеру в Telegram.</p>
</main>
<script>
const el=document.getElementById("slots");
["09:00","10:30","12:00","14:00","16:00","18:30"].forEach((t,i)=>{
  const b=document.createElement("button"); b.type="button"; b.textContent=t;
  if(i===2) b.className="on";
  b.onclick=()=>{ [...el.children].forEach(x=>x.classList.remove("on")); b.classList.add("on"); };
  el.appendChild(b);
});
</script>
</body>
</html>

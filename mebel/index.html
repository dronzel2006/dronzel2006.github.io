<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вторая жизнь — реставрация мебели</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root { --wood:#7a4b2a; --bg:#f6efe6; --ink:#2a1c12; --muted:#7a6a5a; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:"Nunito Sans",sans-serif; background:var(--bg); color:var(--ink); }
a { color:inherit; text-decoration:none; }
.wrap { width:min(1120px, calc(100% - 32px)); margin:0 auto; }
header { background:rgba(246,239,230,.9); position:sticky; top:0; z-index:10; border-bottom:1px solid #e7d8c6; }
.bar { display:flex; align-items:center; height:70px; }
.logo { font-family:Fraunces,serif; font-size:24px; }
nav { margin-left:auto; display:flex; gap:16px; font-weight:700; font-size:14px; }
nav a.on { color:var(--wood); }
.hero { position:relative; margin:24px 0; border-radius:28px; overflow:hidden; min-height:460px; }
.hero img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.hero-in { position:relative; z-index:1; padding:48px; max-width:520px; background:linear-gradient(90deg,rgba(246,239,230,.94),rgba(246,239,230,.2)); min-height:460px; display:flex; flex-direction:column; justify-content:center; }
h1 { font-family:Fraunces,serif; font-size:clamp(36px,5vw,54px); line-height:1.05; margin:8px 0 12px; }
.btn { display:inline-block; background:var(--wood); color:#fff; padding:12px 18px; border-radius:999px; font-weight:700; }
.pair { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin:10px 0 50px; }
.pair figure { background:#fff; border-radius:20px; overflow:hidden; }
.pair img { width:100%; height:320px; object-fit:cover; }
.pair figcaption { padding:12px 16px; font-weight:700; }
.muted { color:var(--muted); }
footer { padding:22px 0; color:var(--muted); font-size:13px; }
@media(max-width:800px){ .pair{grid-template-columns:1fr} nav{display:none} }
</style>
</head>
<body>
<header><div class="wrap bar">
  <a class="logo" href="index.html">Вторая жизнь</a>
  <nav>
    <a class="on" href="index.html">Мастерская</a>
    <a href="works.html">Работы</a>
    <a href="order.html">Оценка по фото</a>
  </nav>
</div></header>
<main class="wrap">
  <section class="hero">
    <img src="img/mebel_hero.jpg" alt="Мастерская">
    <div class="hero-in">
      <p style="font-weight:800;color:var(--wood);letter-spacing:.14em;font-size:12px">РЕСТАВРАЦИЯ</p>
      <h1>Старой мебели возвращаем характер</h1>
      <p class="muted" style="margin-bottom:18px">Перетяжка, шпон, лак, ремонт каркаса. Срок обычно 10–21 день.</p>
      <a class="btn" href="order.html">Прислать фото на оценку</a>
    </div>
  </section>
  <h2 style="font-family:Fraunces,serif;margin-bottom:12px">До и после</h2>
  <div class="pair">
    <figure><img src="img/mebel_before.jpg" alt="До"><figcaption>До</figcaption></figure>
    <figure><img src="img/mebel_after.jpg" alt="После"><figcaption>После · кресло, бархат</figcaption></figure>
  </div>
</main>
<footer><div class="wrap">Вторая жизнь — демо-сайт мастерской · Андрей Добридник</div></footer>
</body>
</html>

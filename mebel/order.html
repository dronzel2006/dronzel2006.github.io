<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Оценка по фото — Вторая жизнь</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Nunito+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
body{font-family:"Nunito Sans",sans-serif;margin:0;background:#f6efe6;color:#2a1c12}
.wrap{width:min(680px,calc(100% - 32px));margin:0 auto}
.bar{width:min(1120px,calc(100% - 32px));margin:0 auto;display:flex;align-items:center;height:70px}
.logo{font-family:Fraunces,serif;font-size:24px;text-decoration:none;color:inherit}
nav{margin-left:auto;display:flex;gap:16px;font-weight:700;font-size:14px}
nav a{color:inherit;text-decoration:none} nav a.on{color:#7a4b2a}
form{background:#fff;padding:22px;border-radius:20px;display:grid;gap:10px;margin:24px 0 60px}
input,textarea,select{padding:12px;border:1px solid #e7d8c6;border-radius:10px;font:15px Nunito Sans}
button{background:#7a4b2a;color:#fff;border:0;padding:12px;border-radius:12px;font-weight:700;cursor:pointer}
#preview{display:none;width:100%;max-height:240px;object-fit:cover;border-radius:12px}
</style>
</head>
<body>
<header style="border-bottom:1px solid #e7d8c6;background:#f6efe6"><div class="bar">
  <a class="logo" href="index.html">Вторая жизнь</a>
  <nav><a href="index.html">Мастерская</a><a href="works.html">Работы</a><a class="on" href="order.html">Оценка по фото</a></nav>
</div></header>
<main class="wrap">
  <h1 style="font-family:Fraunces,serif;margin:28px 0 8px">Пришлите фото</h1>
  <p style="color:#7a6a5a">Ориентир по цене за 1 день. Форма демо, файлы никуда не уходят.</p>
  <form onsubmit="event.preventDefault(); this.hidden=true; ok.hidden=false;">
    <img id="preview" alt="Превью">
    <input type="file" accept="image/*" onchange="preview.src=URL.createObjectURL(this.files[0]); preview.style.display='block'">
    <input required placeholder="Имя">
    <input required placeholder="Телефон" type="tel">
    <select><option>Перетяжка</option><option>Шпон и лак</option><option>Ремонт каркаса</option><option>Не знаю — подскажите</option></select>
    <textarea rows="3" placeholder="Что случилось с мебелью"></textarea>
    <button>Получить оценку</button>
  </form>
  <p id="ok" hidden>Спасибо. В боевом проекте сюда подключается Telegram или почта.</p>
</main>
</body>
</html>
